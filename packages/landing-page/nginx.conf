# The public landing site (issue #113). Copied to
# /etc/nginx/conf.d/default.conf — not a `.template`, because nothing in it is
# substituted at container start: this container serves static files and talks
# to no upstream.
#
# It owns the domain root and nothing else. `/app` (the SPA), `/api` and
# `/uploads` belong to the web container and are routed there by the reverse
# proxy in front of both — see docs/operations/deploy.md. Declaring them here
# would be a second opinion about routing, and the wrong one.
server {
	listen 80;
	server_name _;

	root /usr/share/nginx/html;
	index index.html;

	gzip on;
	gzip_types text/css application/javascript image/svg+xml;
	gzip_min_length 1024;

	# The page is prerendered and its stylesheet is content-hashed, so the
	# document must never be cached and the asset can be cached forever.
	location = /index.html {
		add_header Cache-Control "no-store";
	}

	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, immutable";
	}

	# One page, so an unknown path is a mistake: 404, not the page. The web
	# container's `try_files` falls back to its shell because a single-page app
	# owns its own routing; nothing here does.
	location / {
		try_files $uri $uri/ =404;
	}
}
